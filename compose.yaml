services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      RESEARCHFORGE_MOCK_LLM: ${RESEARCHFORGE_MOCK_LLM:-true}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}

    volumes:
      - backend_uploads:/app/uploads
      - huggingface_cache:/root/.cache/huggingface

    depends_on:
      db:
        condition: service_healthy

    command:
      >
        sh -c "
        python -m flask --app app db upgrade &&
        gunicorn
        --bind 0.0.0.0:5000
        --workers 2
        --timeout 120
        wsgi:app
        "

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "healthcheck.py"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy


volumes:
  postgres_data:
  backend_uploads:
  huggingface_cache: